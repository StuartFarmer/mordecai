<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1419" />
    <meta name="description" content="Mordecai. P2P toolkit for a distributed world." />
    <title>Mordecai — Node</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./mordecai.css" />
    <script src="./mordecai.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Mordecai</h1>
        <p class="tagline">P2P toolkit for a distributed world.</p>
        <nav aria-label="Resources">
          <a href="./docs/">Read the documentation</a>
          <a href="./api/head">View chain API</a>
        </nav>
      </header>

      <section aria-labelledby="node-title">
        <div class="section-heading">
          <h2 id="node-title">This node</h2>
          <p id="status" role="status" aria-live="polite" data-state="checking">Checking node</p>
        </div>
        <dl>
          <div>
            <dt>Network</dt>
            <dd id="chain-id">—</dd>
          </div>
          <div>
            <dt>Block height</dt>
            <dd id="height">—</dd>
          </div>
          <div>
            <dt>Latest block</dt>
            <dd id="head-hash">—</dd>
          </div>
        </dl>
        <p id="last-checked">Waiting for chain data. Updates every 10 seconds.</p>
        <noscript
          ><p>
            Enable JavaScript for live node details, or use the chain API link above.
          </p></noscript
        >
      </section>
    </main>
  </body>
</html>
